# TLS is terminated on the proxy in front of the VM, which forwards plain HTTP:
# board.lit.x3lfy.space:443 (TLS) -> proxy -> this cluster on :80 (or :443).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rctf
  namespace: rctf
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`board.lit.x3lfy.space`)
      priority: 10
      services:
        - name: rctf
          port: 80
