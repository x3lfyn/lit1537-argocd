apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rctf-instancer
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/x3lfyn/lit1537-argocd.git
    targetRevision: main
    path: rctf-instancer
    directory:
      include: '*.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: rctf-operator-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
