apiVersion: v1
kind: ConfigMap
metadata:
  name: error-pages
  namespace: traefik
data:
  nginx.conf: |
    events {}

    http {
        server {
            listen 80;
            server_name _;

            # Traefik is a bit annoying as it does not let us serve specific paths as fallback, and instead we need to
            # make nginx count everything as a 404 (while supporting returning the 503 response as well)
            location = /.rctf-operator/health {
                access_log off;
                return 200 'ok';
            }

            location = /.rctf-operator/404.html {
                alias /usr/share/nginx/error-pages/404.html;
            }

            location = /.rctf-operator/502.html {
                alias /usr/share/nginx/error-pages/502.html;
            }

            location / {
                return 404;
            }

            error_page 404 /.rctf-operator/404.html;
        }
    }
  404.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>lit1537 CTF instancer</title>
        <style>
          :root { color-scheme: light; }
          body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            background: #f2f3f5; color: #111827;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
          }
          .wrap { text-align: center; padding: 24px; }
          h1 { margin: 0 0 10px; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
          p { margin: 0; font-size: 14px; color: #4b5563; }
        </style>
      </head>
      <body>
        <main class="wrap">
          <h1>lit1537 CTF</h1>
          <p>404 - no instance deployed here (has it expired?)</p>
        </main>
      </body>
    </html>
  502.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>lit1537 CTF instancer</title>
        <style>
          :root { color-scheme: light; }
          body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            background: #f2f3f5; color: #111827;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
          }
          .wrap { text-align: center; padding: 24px; }
          h1 { margin: 0 0 10px; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
          p { margin: 0; font-size: 14px; color: #4b5563; }
        </style>
      </head>
      <body>
        <main class="wrap">
          <h1>lit1537 CTF</h1>
          <p>502 - the instance is still starting or went down</p>
        </main>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: error-pages
  namespace: traefik
  labels:
    app: error-pages
spec:
  replicas: 1
  selector:
    matchLabels:
      app: error-pages
  template:
    metadata:
      labels:
        app: error-pages
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: cfg
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: cfg
              mountPath: /usr/share/nginx/error-pages/404.html
              subPath: 404.html
            - name: cfg
              mountPath: /usr/share/nginx/error-pages/502.html
              subPath: 502.html
          readinessProbe:
            httpGet:
              path: /.rctf-operator/health
              port: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: cfg
          configMap:
            name: error-pages
---
apiVersion: v1
kind: Service
metadata:
  name: error-pages
  namespace: traefik
spec:
  selector:
    app: error-pages
  ports:
    - name: http
      port: 80
      targetPort: 80
