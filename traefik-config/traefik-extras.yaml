# Traefik extras required by the rCTF k8s instancer, mirroring the upstream
# terraform module (rctf/deploy/terraform/instancer/modules/k8s/traefik.tf):
#   - `global-errors` middleware serving the 502 error page (attached to the
#     web/websecure entrypoints via the HelmChartConfig)
#   - catch-all IngressRoute serving the 404 page for unknown instance hosts
#
# TLS is NOT terminated on traefik: the proxy in front of the VM terminates
# TLS and forwards plain HTTP (see README.md). Port 1337 (tcp-ssl expose kind)
# is SNI-based TCP passthrough end-to-end.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: global-errors
  namespace: traefik
spec:
  errors:
    # 404 is not here because it won't work as a catch-all and would instead
    # serve the custom page when the challenge behind it returns a 404
    status:
      - "502"
    service:
      name: error-pages
      namespace: traefik
      port: 80
    query: "/.rctf-operator/{status}.html"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: catch-all
  namespace: traefik
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: HostRegexp(`.*`)
      priority: 1
      services:
        - name: error-pages
          port: 80
